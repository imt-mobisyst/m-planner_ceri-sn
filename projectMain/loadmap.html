<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CERI-SN IMT M-planner</title>
        <meta name="escription" content="BDS aquatic mission planner for aerodynamically eleveted marine drone">
        <link rel="stylesheet" href="./style/resources/notiflix.css">
        <link rel="stylesheet" href="./style/style.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
        </script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
        <link rel="canonical" href="https://iconduck.com/free-icons/geojson-file" />
        <script src="./js/resources/leaflet.polylineDecorator.js"></script>
    </head>

    <body>
        <div class="container">
         
          <header>CERI-SN IMT M-planner v0.0</header>
          <nav>
            <label for="step">Discretization step:</label>
            <input id="step" type="number" min="1" max="5" size="5" step="1" placeholder="5"/>
            <button class="button button1" onclick="getDiscretizationstep()">Confirm step</button>
            <span id="displaySelectedstep"></span>
            <button class="button button2" onclick="toggleGrid()">Generate grid</button>
            <button class="button button3" onclick="clearGrid()">Clear grid</button>
            <button class="button button4" onclick="showCoordOnMap()">Zone's coordinates</button>
            <select class="option" name="Path points options" id="point-option-select"> 
              <option value="show-coord">Show coordinates</option>
              <option value="start-point">Select starting coordinate</option>
              <option value="add-point">Add coordinate</option>
              <option value="remove-point">Remove coordinate</option>
           </select>
            <button class="button button5" onclick="drawPath()">Plan</button>
            <button class="button button6">Replan</button> 
            <button class="button button7" onclick="checkTranspassing()">Check trans-passing</button> 
          </nav>
          
          <main>
            <div id="map">
              <script src="https://cdn.jsdelivr.net/gh/tomickigrzegorz/autocomplete@2.0.1/dist/js/autocomplete.min.js"></script>
              <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
              <script src="./js/resources/notiflix.js"></script>
              <script src="./js/mainScript.js"></script>
              <script src="./js/discretizationFunctions.js"></script>
            </div>
          </main>

        </div>
    </body>
    
</html>
